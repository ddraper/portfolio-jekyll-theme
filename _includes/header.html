<header>
  <div class="logo">
    <a href="{{ site.github.url }}/">
      {{ site.title }} <span class="subtitle">{{ site.subtitle }}</span>
    </a>  
  </div>
  <nav>
    {% for item in site.data.settings.menu %}
    {% assign full_url = '/' | append: item.url %}
    <a href="{{ site.github.url }}/{{ item.url }}" class="{% if page.url == full_url %}active{% endif %}">
      {{ item.name }}
    </a>
  {% endfor %}
  </nav>
</header>
